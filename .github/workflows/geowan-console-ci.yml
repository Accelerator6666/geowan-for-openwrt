name: GeoWAN Console checks

on:
  push:
    branches: [main, develop-v0.5.0, develop-v0.5.1, develop-v0.6.0, develop-v0.7.0-global-sensitive-enforcement]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Python syntax
        run: python3 -m py_compile agent/*.py rpcd/geowan
      - name: POSIX shell syntax
        run: |
          for file in install.sh uninstall.sh preflight.sh scripts/*.sh; do
            sh -n "$file"
          done
      - name: LuCI JavaScript syntax
        run: node --check luci/overview.js
      - name: JSON syntax
        run: |
          python3 -m json.tool luci/acl.json >/dev/null
          python3 -m json.tool luci/menu.json >/dev/null
          python3 -m json.tool enforcement.example.json >/dev/null
